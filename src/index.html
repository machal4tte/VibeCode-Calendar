<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electron Calendar</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">▦</span><span><b>Calendar</b><small>Plan your time</small></span></div><nav><button id="today">Today</button><button id="prev">‹</button><button id="next">›</button><h1 id="heading">Calendar</h1><div class="views"><button data-view="day">Day</button><button data-view="month" class="active">Month</button><button data-view="year">Year</button></div></nav><button id="add" class="primary">＋ New event</button></header>
<main><aside><b>Calendars</b><p><span class="dot"></span> My calendar</p><p class="muted">Events are saved locally on this device.</p><button id="import">Import .ics</button><button id="export">Export .ics</button><hr><p class="muted">Exchange events with Apple Calendar, Outlook, GNOME Calendar, Thunderbird and other apps using .ics files.</p></aside><section id="calendar"></section></main>
<dialog id="editor"><form id="form" method="dialog"><div class="dialog-head"><h2 id="form-heading">New event</h2><button type="button" data-close>✕</button></div><input type="hidden" id="id"><label>Title<input id="title" required maxlength="180"></label><div class="two"><label>Start<input id="start" type="datetime-local" required></label><label>End<input id="end" type="datetime-local" required></label></div><label class="check"><input id="allday" type="checkbox"> All day</label><label>Notes<textarea id="notes" rows="3"></textarea></label><div class="actions"><button type="button" id="delete" class="danger">Delete</button><span class="spacer"></span><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><div id="toast" role="status"></div><script src="renderer.js"></script></body></html>
